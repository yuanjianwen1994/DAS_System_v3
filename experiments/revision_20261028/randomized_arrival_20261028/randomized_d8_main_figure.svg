<text x="709" y="442" text-anchor="start" font-family="Arial,sans-serif" font-size="12" font-weight="normal" fill="#222">seed 32 · repaired NEAR / existing EVM (all-phase)</text>
<text x="40" y="486" text-anchor="start" font-family="Arial,sans-serif" font-size="14" font-weight="bold" fill="#222">Audit denominators and cohort definitions</text>
<text x="40" y="510" text-anchor="start" font-family="Arial,sans-serif" font-size="12" font-weight="normal" fill="#222">All displayed p50/p95 use all fully audited successes in each full phase, including warmup and drain completions; they are not observation-window-only percentiles.</text>
<text x="40" y="532" text-anchor="start" font-family="Arial,sans-serif" font-size="12" font-weight="normal" fill="#222">Latency n per platform, λ=.5 / 1.0: seed 31 415 / 816; seed 32 385 / 817.</text>
<text x="40" y="554" text-anchor="start" font-family="Arial,sans-serif" font-size="12" font-weight="normal" fill="#222">Goodput uses successful sink completions within the 780 s observation window: seed 32 EVM 368 / 781, NEAR 369 / 789 (λ=.5 / 1.0).</text>
<text x="40" y="576" text-anchor="start" font-family="Arial,sans-serif" font-size="12" font-weight="normal" fill="#222">Seed 32 repaired replay: NEAR 385/385 and 817/817 audited; 0 failures, 0 pending. EVM is the existing same-schedule baseline; only NEAR was replayed.</text>
<text x="40" y="598" text-anchor="start" font-family="Arial,sans-serif" font-size="12" font-weight="normal" fill="#222">Historical seed 32 NEAR before repair: 353 audited + 10 failure labels + 22 pending (λ=.5); 767 + 16 + 34 (λ=1). Kept separate. Seed 30 overlapped unrelated NEAR work.</text>
<text x="40" y="620" text-anchor="start" font-family="Arial,sans-serif" font-size="12" font-weight="normal" fill="#222">Workload: 8 stateful contracts, 7 dependent edges, 16 operations per stage; 30 s preheat + 780 s observation. The local runtime latency gap is not a DAS causal estimate.</text>
<text x="40" y="642" text-anchor="start" font-family="Arial,sans-serif" font-size="12" font-weight="bold" fill="#222">Do not extrapolate d8 to a 20-contract cascade: depth, receipt/block progression, overlap, contention, and critical path may change.</text>
<text x="40" y="676" text-anchor="start" font-family="Arial,sans-serif" font-size="11" font-weight="normal" fill="#555">Seed 31/32 are not three fresh same-condition repeats · NEAR 2.13.4 / protocol 86 · cleanup_status=forced_after_timeout</text>
