[package]
name = "das-near-business-flow"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = []
inventory-contract = []
router-contract = []
order-book-contract = []
local-contract = []
stage-contract = []
composite-contract = []

[dependencies]
near-sdk = { version = "5.17.2", features = ["legacy"] }

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
panic = "abort"
overflow-checks = true
